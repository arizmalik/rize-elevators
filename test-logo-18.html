<!DOCTYPE html>
<html>
<body style="background: #e2e8f0; display: flex; gap: 20px; padding: 50px;">

<svg viewBox="0 0 100 100" width="400" height="400" style="background: white; outline: 1px solid #ccc;">
  <!-- Dark Blue R -->
  <!-- R matches the proportions, but we'll center the arrow -->
  <path d="M 20 20 H 65 C 85 20 90 35 90 50 C 90 65 80 75 65 75 L 85 100 H 60 L 45 75 H 40 V 100 H 20 Z M 40 38 V 55 H 65 C 70 55 70 38 65 38 Z" fill="#1e3a5f" fill-rule="evenodd" />
  
  <!-- Arrow centered on the letter R, going to the top.
       Center of R width (20 to 90) is ~55. Center of left vertical block (20 to 40) is 30.
       The image shows the arrow centered exactly between the left boundary and right boundary of the solid parts, or centered on the left leg?
       Actually, the image shows the arrow centered in the *middle of the whole R*.
       Let's center it at x = 50.
  -->
  <path d="M 50 10 L 25 45 H 35 L 30 100 H 70 L 65 45 H 75 Z" fill="white" />
  
  <!-- Light Grey Arrow Left Half -->
  <path d="M 50 20 L 33 40 H 40 L 35 100 H 49.5 Z" fill="#cbd5e1" />
  
  <!-- Dark Grey Arrow Right Half -->
  <path d="M 50 20 L 67 40 H 60 L 65 100 H 50.5 Z" fill="#64748b" />
</svg>

</body>
</html>
