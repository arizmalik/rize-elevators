<!DOCTYPE html>
<html>
<body style="background: #e2e8f0; display: flex; gap: 20px; padding: 50px;">

<!-- Larger arrow, centered in the R -->
<svg viewBox="0 0 100 100" width="400" height="400" style="background: white; outline: 1px solid #ccc;">
  <!-- We need the R to be wider so the arrow can be centered. 
       Let's center the entire R block at x=50. 
       R left edge = 10, right edge = 90. Center of R = 50.
  -->
  <path d="M 10 10 H 70 C 95 10 95 30 95 45 C 95 60 85 65 70 65 L 90 95 H 65 L 50 65 H 45 V 95 H 10 Z M 45 35 V 50 H 70 C 80 50 80 35 70 35 Z" fill="#1e3a5f" fill-rule="evenodd" />
  
  <!-- The arrow is perfectly centered at x=50. 
       Tip at y=0, base at y=95 
       White Cutout Area
  -->
  <path d="M 50 5 L 25 45 H 35 L 30 95 H 70 L 65 45 H 75 Z" fill="white" />
  
  <!-- Light Grey Arrow Left Half -->
  <path d="M 50 15 L 32 40 H 40 L 35 95 H 49.5 Z" fill="#cbd5e1" />
  
  <!-- Dark Grey Arrow Right Half -->
  <path d="M 50 15 L 68 40 H 60 L 65 95 H 50.5 Z" fill="#64748b" />
</svg>

</body>
</html>
