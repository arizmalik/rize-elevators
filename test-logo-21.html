<!DOCTYPE html>

<body style="background: #e2e8f0; display: flex; gap: 20px; padding: 50px;">

<svg viewBox="0 0 100 100" width="400" height="400" style="background: white; outline: 1px solid #ccc;">
  <!-- Dark Blue R -->
  <!-- It's one massive block for the left leg, and the arrow cuts exactly in the middle of it.
       Let's say left block is x=15 to x=65. Center = 40.
       Loop is from x=65 to x=95.
  -->
  <path d="M 15 15 H 70 C 95 15 100 30 100 45 C 100 60 90 70 75 70 L 95 100 H 70 L 55 70 H 50 V 100 H 15 Z M 50 35 V 50 H 75 C 80 50 80 35 75 35 Z" fill="#1e3a5f" fill-rule="evenodd" />
  
  <!-- Arrow centered at x=40. Tip reaches above the R (y=5). -->
  <path d="M 40 5 L 15 45 H 25 L 15 100 H 65 L 55 45 H 65 Z" fill="white" />
  
  <path d="M 40 15 L 22 40 H 30 L 22 100 H 39.5 Z" fill="#cbd5e1" />
  <path d="M 40 15 L 58 40 H 50 L 58 100 H 40.5 Z" fill="#64748b" />
</svg>

</body>
