<!DOCTYPE html>
<html>
<body style="background: #e2e8f0; display: flex; gap: 20px; padding: 50px;">

<!-- Larger and perfectly centered arrow -->
<svg viewBox="0 0 100 100" width="400" height="400" style="background: white; outline: 1px solid #ccc;">
  <!-- Dark Blue R -->
  <!-- Let's adjust the R so the center of the left leg is around x=45 or x=50, or just widen the left leg entirely -->
  <!-- Wait, looking at the image, the arrow is centered IN THE LEFT LEG of the R, not the whole R. The left leg is just extremely thick to accommodate it. -->
  <path d="M 20 20 H 65 C 85 20 90 35 90 50 C 90 65 80 75 65 75 L 85 100 H 60 L 45 75 H 45 V 100 H 20 Z M 45 38 V 55 H 65 C 70 55 70 38 65 38 Z" fill="#1e3a5f" fill-rule="evenodd" />
  
  <!-- Arrow centered exactly in the left leg (from x=20 to x=60 roughly... wait, left leg is 20 to 45).
       Center = (20+45)/2 = 32.5.
       Let's center the arrow at x=40, and widen the left leg to x=20 to x=60.
       If left leg is 20 to 60, center is 40. Then loop goes from 60 to 90.
  -->
  <path d="M 20 20 H 70 C 90 20 95 35 95 50 C 95 65 85 75 70 75 L 90 100 H 65 L 50 75 H 55 V 100 H 20 Z M 55 38 V 55 H 70 C 75 55 75 38 70 38 Z" fill="#1e3a5f" fill-rule="evenodd" />
  
  <!-- Cutout at x=45 -->
  <path d="M 45 5 L 20 45 H 30 L 25 100 H 65 L 60 45 H 70 Z" fill="white" />
  
  <path d="M 45 15 L 28 40 H 35 L 30 100 H 44.5 Z" fill="#cbd5e1" />
  <path d="M 45 15 L 62 40 H 55 L 60 100 H 45.5 Z" fill="#64748b" />
</svg>

</body>
</html>
